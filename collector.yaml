receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'confluent-cloud'
          scrape_interval: 2m
          scrape_timeout: 1m
          static_configs:
            - targets: ['api.telemetry.confluent.cloud']
          scheme: https
          basic_auth:
            username: <username>
            password: <password>
          metrics_path: /v2/metrics/cloud/export
          params:
            "resource.kafka.id":
              - <cluster_id>

exporters:
  otlphttp:
    endpoint: https://otlp.nr-data.net:4317
    headers:
      api-key: <api_key>

processors:
  batch:

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlphttp]
